<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Outer Circle & Main Icon Gradients -->
    <linearGradient id="circleGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#003B5C" />
      <stop offset="50%" stop-color="#008060" />
      <stop offset="100%" stop-color="#69BE28" />
    </linearGradient>

    <linearGradient id="leftVGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E4877" />
      <stop offset="100%" stop-color="#021E36" />
    </linearGradient>

    <linearGradient id="rightLeafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1DB954" />
      <stop offset="100%" stop-color="#8EE000" />
    </linearGradient>

    <linearGradient id="centerCheckGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#005A36" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>

    <linearGradient id="vitalTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#003B5C" />
      <stop offset="100%" stop-color="#0E5C8A" />
    </linearGradient>

    <linearGradient id="careTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="600" height="600" fill="#FFFFFF" />

  <!-- Outer Gradient Border -->
  <circle cx="300" cy="300" r="260" fill="none" stroke="url(#circleGrad)" stroke-width="12" />

  <!-- LOGO ICON GROUP -->
  <g transform="translate(0, -10)">
    <!-- Head / Dot -->
    <circle cx="298" cy="152" r="28" fill="#004A75" />

    <!-- Left Wing/Swoosh of V -->
    <path d="M 160 140 C 210 145, 275 220, 310 310 C 270 315, 220 270, 215 250 C 200 210, 180 180, 160 140 Z" fill="url(#leftVGrad)" />

    <!-- Right Leaf -->
    <path d="M 312 255 C 325 180, 390 120, 435 125 C 430 185, 360 255, 312 255 Z" fill="url(#rightLeafGrad)" />
    <!-- Leaf Center Vein Cut -->
    <path d="M 430 130 Q 375 190 338 238" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.7" />

    <!-- Center Green Swoosh / Checkmark Base -->
    <path d="M 270 270 C 300 320, 315 315, 390 230 C 370 280, 320 315, 300 310 Z" fill="url(#centerCheckGrad)" />

    <!-- Medical Plus Symbol -->
    <g transform="translate(393, 267)">
      <path d="M -7 -22 H 7 V -7 H 22 V 7 H 7 V 22 H -7 V 7 H -22 V -7 H -7 Z" fill="#22C55E" rx="3" />
    </g>
  </g>

  <!-- BRAND NAME TEXT -->
  <!-- "Vital" -->
  <text x="78" y="388" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="900" fill="url(#vitalTextGrad)" letter-spacing="-1">Vital</text>

  <!-- "Care" -->
  <text x="238" y="388" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="68" font-weight="700" fill="url(#careTextGrad)" letter-spacing="-1">Care</text>

  <!-- "BD" Box -->
  <g transform="translate(438, 338)">
    <rect x="0" y="0" width="80" height="50" rx="12" fill="#10B981" />
    <text x="40" y="36" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="middle">BD</text>
  </g>

  <!-- SLOGAN & ACCENT LINES -->
  <!-- Left Line -->
  <line x1="106" y1="424" x2="144" y2="424" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" />

  <!-- Tagline Text -->
  <text x="300" y="429" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#003B5C" text-anchor="middle" letter-spacing="0.5">
    Better Health <tspan fill="#10B981" font-weight="400">|</tspan> Brighter You
  </text>

  <!-- Right Line -->
  <line x1="456" y1="424" x2="494" y2="424" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" />
</svg>
