<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Left Blue-Cyan Gradient -->
    <linearGradient id="leftSwooshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B4B70" />
      <stop offset="40%" stop-color="#006A80" />
      <stop offset="100%" stop-color="#009A60" />
    </linearGradient>

    <!-- Right Top Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F8038" />
      <stop offset="60%" stop-color="#34B332" />
      <stop offset="100%" stop-color="#76D218" />
    </linearGradient>

    <!-- Bottom V-Check Green Gradient -->
    <linearGradient id="vCheckGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#026338" />
      <stop offset="50%" stop-color="#1DB24A" />
      <stop offset="100%" stop-color="#55CD2B" />
    </linearGradient>

    <!-- Medical Plus Gradient -->
    <linearGradient id="plusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2CC149" />
      <stop offset="100%" stop-color="#148F37" />
    </linearGradient>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Top Blue Head / Circle -->
    <circle cx="240" cy="92" r="42" fill="#034B70" />

    <!-- Left Wing / Swoosh (V-Shape Left) -->
    <path d="M 38 72 C 105 85, 205 185, 252 355 C 220 375, 172 345, 122 255 C 80 180, 52 130, 38 72 Z" fill="url(#leftSwooshGrad)" />

    <!-- Right Leaf -->
    <path d="M 268 290 C 275 185, 362 82, 442 42 C 435 152, 335 285, 268 290 Z" fill="url(#leafGrad)" />
    
    <!-- White Vein Inside Leaf -->
    <path d="M 436 48 Q 355 170, 292 250" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.9" />

    <!-- Bottom Right Green Swoosh / Checkmark Base -->
    <path d="M 195 315 C 248 418, 272 432, 358 280 C 315 360, 260 415, 222 390 Z" fill="url(#vCheckGrad)" />

    <!-- Plus Symbol (+) -->
    <g transform="translate(382, 368)">
      <rect x="-11" y="-35" width="22" height="70" rx="9" fill="url(#plusGrad)" />
      <rect x="-35" y="-11" width="70" height="22" rx="9" fill="url(#plusGrad)" />
    </g>
  </g>
</svg>
